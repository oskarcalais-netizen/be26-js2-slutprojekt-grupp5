<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>be25-js2-slutprojekt-grupp5</title>
  </head>
  <body>
    <header
      class="relative flex items-center h-20 px-6 bg-slate-900 border-b border-slate-800"
    >
      <h1
        class="absolute left-6 text-2xl font-black tracking-widest text-indigo-400"
      >
        D.O.Z
      </h1>

      <p
        class="w-full text-center text-xl font-semibold text-slate-100 tracking-wide"
      >
        Scrum Board
      </p>
    </header>

    <main class="min-h-screen bg-slate-950 px-6 py-10">
      <h2 class="mb-8 text-3xl font-bold text-slate-100">Overview</h2>

      <section id="projectsContainer" class="mb-12">
        <div class="mb-5 flex items-center justify-between">
          <h3 class="text-2xl font-bold text-slate-100">Projects</h3>
          <button
            id="newprojectbtn"
            type="button"
            class="flex gap-1 items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-300 hover:scale-105"
          >
            New project
          </button>
        </div>

        <div
          id="projectList"
          class="grid gap-6 md:grid-cols-2 xl:grid-cols-3"
        ></div>
      </section>

      <section id="membersContainer">
        <div class="mb-5 flex items-center justify-between">
          <h3 class="text-2xl font-bold text-slate-100">Members</h3>
          <button
            id="newmemberbtn"
            type="button"
            class="flex gap-1 items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-300 hover:scale-105"
          >
            New member
          </button>
        </div>

        <ul
          id="memberList"
          class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"
        ></ul>
      </section>
    </main>

    <div id="memberContainer"></div>
    <div id="projectContainer"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
